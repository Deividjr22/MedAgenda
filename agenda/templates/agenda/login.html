{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Login</title>
</head>

<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">

        <div class="w-100 p-4 bg-white rounded shadow-sm" style="max-width: 420px;">

            <div class="text-center mb-4">
                <div>
                    <!-- colocar no fundo do icone um quadrado azul como esta no marckup -->
                    <i class="bi bi-heart-pulse fs-1 text-primary "></i>
                </div>
                <h1 class="h3 mt-3">MedAgenda</h1>
                <p class="text-muted">Sistema de Agendamento e Gestão de Consultorio</p>
            </div>

            <!-- Bloco de Alertas/Mensagens do Django -->
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}

            <!-- Form configurado para POST e rota 'login' -->
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">E-mail ou Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" aria-describedby="emailHelp"
                        placeholder="contato@medagenda.com.br" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="*****************" required>
                </div>

                <div class="mb-3 form-check d-flex justify-content-between align-items-center ps-0">
                    <div>
                        <input type="checkbox" class="form-check-input ms-0 me-2" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Lembrar-me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar no MedAgenda</button>

                <div class="text-center mt-3">
                    <a href="{% url 'cadastro' %}" class="text-decoration-none">Não tem uma conta? Cadastre-se</a>
                </div>

                <!-- Mensagem de acesso restrito -->
                <div class="text-center fw-light mt-2">
                    Acesso restrito para profissionais de saúde credenciados.
                </div>
            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
