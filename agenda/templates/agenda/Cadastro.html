{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Cadastro</title>
</head>

<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">

        <div class="w-100 p-4 bg-white rounded shadow-sm" style="max-width: 420px;">

            <div class="text-center mb-4">
                <div class="">
                    <i class="bi bi-heart-pulse fs-1 text-primary "></i>
                </div>
                <h1 class="h3 mt-3">MedAgenda</h1>
                <p class="text-muted">Sistema de Agendamento e Gestão de Consultorio</p>
            </div>

            <!-- Bloco para exibir mensagens de erro/sucesso do Django -->
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}

            <!-- Formulário com POST e CSRF Token -->
            <form method="POST" action="{% url 'cadastro' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email"
                        placeholder="contato@medagenda.com.br" required>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000">
                </div>

                <div class="mb-3 needs-validation">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00"
                        maxlength="14">
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username"
                        placeholder="Seu nome de usuário" required>
                </div>

                <div class="mb-3 needs-validation">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="*****************" required>
                </div>

                <div class="mb-3 needs-validation">
                    <label for="confirm_password" class="form-label">Confirme a Senha </label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                        placeholder="*****************" required>
                </div>

                <div class="mb-3 form-check d-flex justify-content-between align-items-center ps-0">
                    <div>
                        <input type="checkbox" class="form-check-input ms-0 me-2" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Lembrar-me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
            </form>

            <p class="mt-3 text-center">
                Já tem uma conta? <a href="{% url 'login' %}">Faça Login</a>
            </p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
